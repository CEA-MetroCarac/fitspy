on:
  release:
    types: [published, released]

jobs:
  pypi-publish:
    name: Upload release to PyPI
    # 'published' fires for releases and pre-releases, 'released' fires for full
    # releases only - including when a pre-release is promoted to one, which
    # 'published' does not catch. Keeping 'published' for pre-releases only gives
    # exactly one upload per transition:
    #   pre-release published        -> published (prerelease) -> Test PyPI
    #   pre-release promoted         -> released               -> PyPI
    #   release published directly   -> released               -> PyPI
    # (the 'published' event of that last case is skipped, otherwise the release
    #  would be uploaded twice and the second run would fail on PyPI)
    if: github.event.action == 'released' || github.event.release.prerelease
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/project/fitspy
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install build and twine
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: |
        python -m build

    - name: Check package with Twine
      run: |
        twine check dist/*

    - name: Determine PyPI repository
      run: |
        if [[ ${{ github.event.release.prerelease }} == 'true' ]]; then
          echo "REPOSITORY_URL=https://test.pypi.org/legacy/" >> $GITHUB_ENV
          echo "PYPI_API_TOKEN=${{ secrets.TEST_PYPI_API_TOKEN }}" >> $GITHUB_ENV
        else
          echo "REPOSITORY_URL=https://upload.pypi.org/legacy/" >> $GITHUB_ENV
          echo "PYPI_API_TOKEN=${{ secrets.PYPI_API_TOKEN }}" >> $GITHUB_ENV
        fi

    - name: Publish package distributions to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: ${{ env.REPOSITORY_URL }}
        user: __token__
        password: ${{ env.PYPI_API_TOKEN }}
